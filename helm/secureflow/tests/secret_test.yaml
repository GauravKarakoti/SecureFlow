suite: test secret templates
templates:
  - secret.yaml

values:
  - ../values.yaml

tests:
  - it: should render secret when valid authSecret is provided
    set:
      secrets.authSecret: local-test-only-secret-key
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secureflow-secrets
      - equal:
          path: stringData.AUTH_SECRET
          value: local-test-only-secret-key

  - it: should fail when authSecret is missing and existingSecret is not set
    set:
      secrets.authSecret: ""
      secrets.existingSecret: ""
    asserts:
      - failedTemplate:
          errorMessage: "ERROR: A secure 'secrets.authSecret' is required when 'secrets.existingSecret' is not set. Generate one using: openssl rand -base64 32"

  - it: should fail when authSecret has changeme placeholder and existingSecret is not set
    set:
      secrets.authSecret: "changeme-in-production"
      secrets.existingSecret: ""
    asserts:
      - failedTemplate:
          errorMessage: "ERROR: A secure 'secrets.authSecret' is required when 'secrets.existingSecret' is not set. Generate one using: openssl rand -base64 32"

  - it: should not render secret when existingSecret is provided
    set:
      secrets.existingSecret: precreated-custom-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render raw secret when externalSecrets is enabled
    set:
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: vault-store
      externalSecrets.data:
        - secretKey: AUTH_SECRET
          remoteRef:
            key: prod/auth-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render raw secret when sealedSecrets is enabled
    set:
      sealedSecrets.enabled: true
      sealedSecrets.encryptedData:
        AUTH_SECRET: synthetic-encrypted-token
    asserts:
      - hasDocuments:
          count: 0
