suite: test servicemonitor template
templates:
  - servicemonitor.yaml

values:
  - ../values.yaml

tests:
  - it: should not render servicemonitor by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render servicemonitor when enabled with defaults
    set:
      serviceMonitor.enabled: true
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secureflow
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - equal:
          path: spec.selector.matchLabels["secureflow-metrics"]
          value: "true"
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: app
      - equal:
          path: spec.endpoints[0].port
          value: http
      - equal:
          path: spec.endpoints[0].path
          value: /api/metrics/landing
      - equal:
          path: spec.endpoints[0].interval
          value: 30s
      - equal:
          path: spec.endpoints[0].scrapeTimeout
          value: 10s

  - it: should render servicemonitor with custom namespace, labels, interval, and port
    set:
      serviceMonitor.enabled: true
      serviceMonitor.namespace: monitoring
      serviceMonitor.interval: 15s
      serviceMonitor.scrapeTimeout: 5s
      service.portName: custom-metrics-port
      serviceMonitor.additionalLabels:
        release: prometheus-stack
    asserts:
      - equal:
          path: metadata.namespace
          value: monitoring
      - equal:
          path: metadata.labels.release
          value: prometheus-stack
      - equal:
          path: spec.endpoints[0].port
          value: custom-metrics-port
      - equal:
          path: spec.endpoints[0].interval
          value: 15s
      - equal:
          path: spec.endpoints[0].scrapeTimeout
          value: 5s
