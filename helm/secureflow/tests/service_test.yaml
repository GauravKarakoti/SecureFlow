suite: test service templates
templates:
  - app-service.yaml
  - worker-service.yaml

values:
  - ../values.yaml

tests:
  - it: should render default app service with ClusterIP, port 9002, metrics port, and metrics label
    template: app-service.yaml
    set:
      secrets.authSecret: local-test-only-secret-key
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secureflow-app
      - equal:
          path: metadata.labels["secureflow-metrics"]
          value: "true"
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 9002
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - equal:
          path: spec.ports[0].name
          value: http
      - equal:
          path: spec.ports[0].protocol
          value: TCP
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: app
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: secureflow

  - it: should render app service with custom type, port, and port name
    template: app-service.yaml
    set:
      secrets.authSecret: local-test-only-secret-key
      app.service.type: LoadBalancer
      app.service.port: 8080
      service.portName: custom-metrics
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].name
          value: custom-metrics

  - it: should render default worker service
    template: worker-service.yaml
    set:
      secrets.authSecret: local-test-only-secret-key
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secureflow-worker
      - equal:
          path: spec.ports[0].port
          value: 3000
      - equal:
          path: spec.ports[0].targetPort
          value: health
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: worker

  - it: should render worker service with custom port
    template: worker-service.yaml
    set:
      secrets.authSecret: local-test-only-secret-key
      worker.service.port: 9090
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 9090
