{{- if not .Values.secrets.existingSecret }}
{{- $authSecret := default "" .Values.secrets.authSecret -}}
{{- if or (empty $authSecret) (hasPrefix "changeme" $authSecret) (hasPrefix "change-me" $authSecret) }}
{{- fail "ERROR: A secure 'secrets.authSecret' is required when 'secrets.existingSecret' is not set. Generate one using: openssl rand -base64 32" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secureflow.secretName" . }}
  labels:
    {{- include "secureflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "secureflow.databaseUrl" . | quote }}
  REDIS_URL: {{ include "secureflow.redisUrl" . | quote }}
  AUTH_SECRET: {{ .Values.secrets.authSecret | quote }}
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | quote }}
  GITHUB_APP_ID: {{ .Values.secrets.githubAppId | quote }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.secrets.githubWebhookSecret | quote }}
  GITHUB_PRIVATE_KEY: {{ .Values.secrets.githubPrivateKey | quote }}
  GITHUB_CLIENT_ID: {{ .Values.secrets.githubClientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.secrets.githubClientSecret | quote }}
  ARMORIQ_API_KEY: {{ .Values.secrets.armoriqApiKey | quote }}
{{- end }}

