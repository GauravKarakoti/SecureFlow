{{- include "secureflow.validateSecretProviders" . }}
{{- if .Values.externalSecrets.enabled }}
{{- if and (empty .Values.externalSecrets.data) (empty .Values.externalSecrets.dataFrom) }}
{{- fail "ERROR: When externalSecrets.enabled is true, 'externalSecrets.data' or 'externalSecrets.dataFrom' must be configured to manage sensitive secrets without plaintext fallbacks." }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "secureflow.secretName" . }}
  labels:
    {{- include "secureflow.labels" . | nindent 4 }}
  {{- with .Values.externalSecrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "SecretStore" }}
  target:
    name: {{ include "secureflow.secretName" . }}
    creationPolicy: {{ .Values.externalSecrets.target.creationPolicy | default "Owner" }}
    template:
      type: Opaque
      metadata:
        labels:
          {{- include "secureflow.labels" . | nindent 10 }}
  {{- if .Values.externalSecrets.data }}
  data:
    {{- toYaml .Values.externalSecrets.data | nindent 4 }}
  {{- end }}
  {{- if .Values.externalSecrets.dataFrom }}
  dataFrom:
    {{- toYaml .Values.externalSecrets.dataFrom | nindent 4 }}
  {{- end }}
{{- end }}
