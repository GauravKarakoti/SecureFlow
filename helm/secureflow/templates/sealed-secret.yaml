{{- include "secureflow.validateSecretProviders" . }}
{{- if .Values.sealedSecrets.enabled }}
{{- if empty .Values.sealedSecrets.encryptedData }}
{{- fail "ERROR: When sealedSecrets.enabled is true, 'sealedSecrets.encryptedData' must be provided with encrypted tokens." }}
{{- end }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "secureflow.secretName" . }}
  labels:
    {{- include "secureflow.labels" . | nindent 4 }}
  {{- with .Values.sealedSecrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  encryptedData:
    {{- toYaml .Values.sealedSecrets.encryptedData | nindent 4 }}
  template:
    type: Opaque
    metadata:
      labels:
        {{- include "secureflow.labels" . | nindent 8 }}
{{- end }}
