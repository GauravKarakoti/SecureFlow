apiVersion: v1
kind: Service
metadata:
  name: {{ include "secureflow.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secureflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
    # Selected by the optional Prometheus ServiceMonitor (#1143).
    secureflow-metrics: "true"
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
      # Named port so the ServiceMonitor can reference it by name rather than
      # number; a number reference breaks if the port ever changes.
      name: {{ .Values.service.portName }}
  selector:
    {{- include "secureflow.selectorLabels" . | nindent 4 }}