{{- if and .Values.postgresql.enabled .Values.postgresql.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "secureflow.fullname" . }}-postgresql
  labels:
    {{- include "secureflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  {{- if .Values.postgresql.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.postgresql.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.postgresql.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.postgresql.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "secureflow.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgresql
{{- end }}
