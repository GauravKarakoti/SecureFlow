{{- if and .Values.worker.enabled .Values.worker.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "secureflow.fullname" . }}-worker
  labels:
    {{- include "secureflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "secureflow.fullname" . }}-worker
  minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.worker.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.worker.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- if and .Values.worker.autoscaling.queueTrigger .Values.worker.autoscaling.queueTrigger.enabled }}
    - type: External
      external:
        metric:
          name: {{ .Values.worker.autoscaling.queueTrigger.metricName | quote }}
        target:
          {{- if eq .Values.worker.autoscaling.queueTrigger.metricType "AverageValue" }}
          type: AverageValue
          averageValue: {{ .Values.worker.autoscaling.queueTrigger.targetAverageValue }}
          {{- else }}
          type: Value
          value: {{ .Values.worker.autoscaling.queueTrigger.targetAverageValue }}
          {{- end }}
    {{- end }}
{{- end }}
