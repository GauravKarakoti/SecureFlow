version: 2
updates:
  # Root project dependencies (Next.js web app)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "typescript"
        versions:
          - ">= 6.0.3"
    groups:
      dependencies:
        patterns:
          - "*"

  # CLI package dependencies
  - package-ecosystem: "npm"
    directory: "/cli"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "typescript"
        versions:
          - ">= 6.0.3"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
