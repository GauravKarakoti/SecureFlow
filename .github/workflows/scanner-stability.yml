name: Scanner LLM Stability Check

on:
  schedule:
    # Run nightly at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of iterations per sample"
        required: false
        default: "5"
      threshold:
        description: "Minimum stability percentage threshold (0-100)"
        required: false
        default: "80"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stability-check:
    name: Golden Sample Stability Evaluation
    runs-on: ubuntu-latest
    # Guard: Never run on pull requests from forks (secret protection & cost bounding)
    if: github.event.pull_request.head.repo.fork != true
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Run Stability Evaluation Suite
        run: |
          RUNS="${{ github.event.inputs.runs || '5' }}"
          THRESHOLD="${{ github.event.inputs.threshold || '80' }}"
          echo "Executing stability check with runs=${RUNS}, threshold=${THRESHOLD}%"
          npx tsx scripts/test-scanner-stability.ts --runs="${RUNS}" --threshold="${THRESHOLD}"
        env:
          NODE_ENV: test
          # Dedicated key for stability monitoring with bounded spend
          GROQ_API_KEY: ${{ secrets.GROQ_STABILITY_API_KEY || secrets.GROQ_API_KEY }}
