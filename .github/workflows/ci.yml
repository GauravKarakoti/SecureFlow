name: Core CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Typecheck, & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["22"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Cache Prisma engines
        uses: actions/cache@v6
        with:
          path: ~/.cache/prisma
          key: prisma-engines-${{ runner.os }}-${{ hashFiles('package-lock.json', 'prisma/schema.prisma') }}
          restore-keys: |
            prisma-engines-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}-

      - name: Run Linter
        run: npm run lint

      - name: Run Typechecker
        run: npm run typecheck

      # Lint OpenAPI specification for schema validity and best practices.
      - name: Lint OpenAPI specification
        run: npm run lint:openapi

      # Fails when a route handler under src/app/api has no entry in openapi.yaml.
      - name: Verify OpenAPI spec covers every API route
        run: npm run verify:openapi

      - name: Build Application
        run: npm run build
        # `next build` evaluates src/lib/env.ts while collecting page data, and
        # that schema requires these variables. This job has no secrets (and
        # pull requests from forks never get any), so without placeholders the
        # build fails on "Invalid environment variables" before it can catch a
        # real build error. Nothing connects to these during the build.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/secureflow
          DATABASE_POOL_URL: postgresql://ci:ci@localhost:5432/secureflow
          GROQ_API_KEY: ci-build-placeholder
          GITHUB_APP_ID: "1"
          GITHUB_WEBHOOK_SECRET: ci-build-placeholder
          GITHUB_PRIVATE_KEY: ci-build-placeholder
          GITHUB_CLIENT_ID: ci-build-placeholder
          GITHUB_CLIENT_SECRET: ci-build-placeholder
          AUTH_SECRET: ci-build-placeholder-not-for-production
          AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Verify OpenAPI Spec Synchronization
        run: npm run verify:openapi

  cli:
    name: CLI Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          # cli/ is an npm workspace, so its dependencies are locked in the root lockfile.
          cache-dependency-path: package-lock.json

      # Install from the root: `npm install` inside cli/ installs only the workspace's own
      # dependencies (no prisma, no vite for vitest) but still runs the root `postinstall`
      # (`prisma generate`), which fails with "prisma: not found".
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build CLI
        run: npm run build
        working-directory: cli

      - name: Test CLI
        run: npm test
        working-directory: cli

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Run Tests
        run: npm test

      - name: Install coverage provider
        run: npm install --no-save @vitest/coverage-v8

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Coverage Report Artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  prisma-drift-check:
    name: Prisma Schema Drift Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/shadow
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/shadow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Fail on unmigrated schema changes
        run: |
          set +e
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::error::Schema drift detected. Run 'npx prisma migrate dev --name <change>' and commit the new migration."
            exit 1
          fi
          exit "$code"

  helm-migration-check:
    name: Helm Migration Job Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint helm/secureflow

      - name: Render migration job
        run: |
          helm template secureflow helm/secureflow \
            --show-only templates/migration-job.yaml > /tmp/migration-job.yaml
          cat /tmp/migration-job.yaml
          grep -q "migrate" /tmp/migration-job.yaml
          grep -q "deploy" /tmp/migration-job.yaml

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [quality-gate, test]
    env:
      # ⭐ NEW: Auth.js configuration for E2E tests
      NEXTAUTH_URL: http://localhost:9002
      NEXTAUTH_SECRET: e2e-test-secret-key
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_MOCK_DB: "true"
      NEXT_PUBLIC_MOCK_AUTH: "true"
      # Server-only opt-in required alongside NEXT_PUBLIC_MOCK_AUTH so the mock
      # auth seam can never be enabled by the public flag alone.
      ALLOW_MOCK_AUTH: "true"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}-

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          AUTH_URL: http://localhost:9002
          E2E_BASE_URL: http://localhost:9002
          AUTH_SECRET: ci-test-secret-not-for-production
          REDIS_URL: ""
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci:ci@localhost:5432/secureflow' }}
          DATABASE_POOL_URL: postgresql://ci:ci@localhost:5432/secureflow
          GROQ_API_KEY: ci-build-placeholder
          GITHUB_APP_ID: "1"
          GITHUB_WEBHOOK_SECRET: e2e-webhook-secret
          GITHUB_PRIVATE_KEY: ci-build-placeholder
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID || 'ci-build-placeholder' }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET || 'ci-build-placeholder' }}
          NEXT_PUBLIC_APP_URL: http://localhost:9002

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  release:
    name: Release / Publish
    # No `red-team` job exists in this workflow (the red-team suite lives in
    # ai-eval.yml), and a needs: reference to an unknown job fails workflow
    # validation — the whole pipeline could not start.
    needs: [quality-gate, cli, test, e2e, prisma-drift-check, helm-migration-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v2
        with:
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
