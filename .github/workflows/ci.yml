name: Core CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Typecheck, & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["22"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Cache Prisma engines
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/prisma
          key: prisma-engines-${{ runner.os }}-${{ hashFiles('package-lock.json', 'prisma/schema.prisma') }}
          restore-keys: |
            prisma-engines-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Cache Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}-

      - name: Run Linter
        run: npm run lint

      - name: Run Typechecker
        run: npm run typecheck

      # Lint OpenAPI specification for schema validity and best practices.
      - name: Lint OpenAPI specification
        run: npm run lint:openapi

      # Fails when a route handler under src/app/api has no entry in openapi.yaml.
      - name: Verify OpenAPI spec covers every API route
        run: npm run verify:openapi

      # Fails when openapi.yaml has changed without regenerating packages/api-client.
      - name: Verify API client is in sync with OpenAPI spec
        run: npm run client:check-drift

      # Enforce ArmorIQ policy guardrails and intent verification quality gate (#1710).
      - name: Enforce ArmorIQ Policy Guardrails
        run: npm run verify:armoriq
        env:
          ARMORIQ_PROOF_SIGNING_KEY: ci-test-armoriq-proof-signing-key
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}

      - name: Build Application
        run: npm run build
        # `next build` evaluates src/lib/env.ts while collecting page data, and
        # that schema requires these variables. This job has no secrets (and
        # pull requests from forks never get any), so without placeholders the
        # build fails on "Invalid environment variables" before it can catch a
        # real build error. Nothing connects to these during the build.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/secureflow
          DATABASE_POOL_URL: postgresql://ci:ci@localhost:5432/secureflow
          GROQ_API_KEY: ci-build-placeholder
          GITHUB_APP_ID: "1"
          GITHUB_WEBHOOK_SECRET: ci-build-placeholder
          GITHUB_PRIVATE_KEY: |
            -----BEGIN PRIVATE KEY-----
            ci-build-placeholder-not-a-real-key
            -----END PRIVATE KEY-----
          GITHUB_CLIENT_ID: ci-build-placeholder
          GITHUB_CLIENT_SECRET: ci-build-placeholder
          AUTH_SECRET: ci-build-placeholder-not-for-production
          AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Verify OpenAPI Spec Synchronization
        run: npm run verify:openapi

      # Compare per-route JavaScript bundle size against stored budgets (#1872).
      - name: Check JavaScript Bundle Size Budgets
        run: npm run check:bundle-budget

      # Run Lighthouse CI audit on authentication and dashboard surfaces (#1872).
      - name: Run Lighthouse CI Audits
        run: npm run lhci:audit

  cli:
    name: CLI Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          # cli/ is an npm workspace, so its dependencies are locked in the root lockfile.
          cache-dependency-path: package-lock.json

      # Install from the root: `npm install` inside cli/ installs only the workspace's own
      # dependencies (no prisma, no vite for vitest) but still runs the root `postinstall`
      # (`prisma generate`), which fails with "prisma: not found".
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build CLI
        run: npm run build
        working-directory: cli

      - name: Test CLI
        run: npm test
        working-directory: cli

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Run Tests
        run: npm test

      - name: Install coverage provider
        run: npm install --no-save @vitest/coverage-v8

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Coverage Report Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  prisma-drift-check:
    name: Prisma Schema Drift Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: secureflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d secureflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/secureflow
      DATABASE_POOL_URL: postgresql://ci:ci@localhost:5432/secureflow
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/secureflow_shadow

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Fail on unmigrated schema changes
        run: |
          # Prisma must never use the application database as its scratch database.
          PGPASSWORD=ci psql -h localhost -U ci -d secureflow \
            -c 'CREATE DATABASE secureflow_shadow'
          set +e
          npm run db:check-drift
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::error::Schema drift detected. Run 'npx prisma migrate dev --name <change>' and commit the new migration."
            exit 1
          fi
          exit "$code"

  helm-migration-check:
    name: Helm Migration Job Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.0

      - name: Lint chart
        run: helm lint helm/secureflow --set secrets.authSecret=local-test-only

      - name: Render migration job
        run: |
          helm template secureflow helm/secureflow \
            --set secrets.authSecret=local-test-only \
            --show-only templates/migration-job.yaml > /tmp/migration-job.yaml
          cat /tmp/migration-job.yaml
          grep -q "migrate" /tmp/migration-job.yaml
          grep -q "deploy" /tmp/migration-job.yaml

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [quality-gate, test]
    env:
      # ⭐ NEW: Auth.js configuration for E2E tests
      NEXTAUTH_URL: http://localhost:9002
      NEXTAUTH_SECRET: e2e-test-secret-key
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_MOCK_DB: "true"
      NEXT_PUBLIC_MOCK_AUTH: "true"
      # Server-only opt-in required alongside NEXT_PUBLIC_MOCK_AUTH so the mock
      # auth seam can never be enabled by the public flag alone.
      ALLOW_MOCK_AUTH: "true"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Cache Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}-

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          AUTH_URL: http://localhost:9002
          E2E_BASE_URL: http://localhost:9002
          AUTH_SECRET: ci-test-secret-not-for-production
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci:ci@localhost:5432/secureflow' }}
          DATABASE_POOL_URL: postgresql://ci:ci@localhost:5432/secureflow
          GROQ_API_KEY: ci-build-placeholder
          GITHUB_APP_ID: "1"
          GITHUB_WEBHOOK_SECRET: e2e-webhook-secret
          GITHUB_PRIVATE_KEY: |
            -----BEGIN PRIVATE KEY-----
            ci-build-placeholder-not-a-real-key
            -----END PRIVATE KEY-----
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID || 'ci-build-placeholder' }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET || 'ci-build-placeholder' }}
          NEXT_PUBLIC_APP_URL: http://localhost:9002

      - name: Upload Playwright Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  actionlint:
    name: Actionlint Workflow Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  zizmor:
    name: Zizmor Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
          annotations: true

  release:
    name: Release / Publish
    # No `red-team` job exists in this workflow (the red-team suite lives in
    # ai-eval.yml), and a needs: reference to an unknown job fails workflow
    # validation — the whole pipeline could not start.
    needs:
      [quality-gate, cli, test, e2e, prisma-drift-check, helm-migration-check, actionlint, zizmor]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create Release Pull Request or Publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
