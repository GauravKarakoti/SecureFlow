name: Helm Chart

on:
  pull_request:
    branches: [main]
    paths:
      - "helm/**"
      - ".github/workflows/helm-chart.yml"
      - ".github/ct.yaml"
      - "scripts/test-helm-chart.sh"
  push:
    branches: [main]
    paths:
      - "helm/**"
      - ".github/workflows/helm-chart.yml"
      - ".github/ct.yaml"
      - "scripts/test-helm-chart.sh"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Helm Lint, Chart-Testing & Unittest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up chart-testing
        uses: helm/chart-testing-action@0d28d3144d3a25ea2cc349d6e59901c4ff469b3b # v2.7.0

      - name: Install helm-unittest plugin
        run: |
          helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest.git

      - name: Helm lint
        run: |
          helm lint helm/secureflow --set secrets.authSecret=local-test-only

      - name: Helm schema validation (negative test with invalid values file)
        run: |
          echo "Verifying helm lint rejects invalid values schema..."
          schema_output="$(helm lint helm/secureflow -f helm/secureflow/tests/invalid-values.yaml 2>&1 || true)"
          if echo "$schema_output" | grep -q -E "additional properties|got string, want integer|maximum:|value must be one of|minimum:"; then
            echo "✅ Helm schema correctly rejected invalid values file."
          else
            echo "❌ Helm schema failed to reject invalid values file!" >&2
            echo "$schema_output" >&2
            exit 1
          fi

      - name: Chart-testing lint (ct lint)
        run: |
          ct lint --config .github/ct.yaml --charts helm/secureflow

      - name: Helm unit tests (helm-unittest)
        run: |
          helm unittest helm/secureflow

      - name: Helm template contract verification
        run: |
          bash scripts/test-helm-chart.sh
