name: Helm Chart

on:
  pull_request:
    branches: [main]
    paths:
      - 'helm/**'
      - '.github/workflows/helm-chart.yml'
      - '.github/ct.yaml'
      - 'scripts/test-helm-chart.sh'
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - '.github/workflows/helm-chart.yml'
      - '.github/ct.yaml'
      - 'scripts/test-helm-chart.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Helm Lint, Chart-Testing & Unittest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Install helm-unittest plugin
        run: |
          helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest.git

      - name: Helm lint
        run: |
          helm lint helm/secureflow --set secrets.authSecret=local-test-only

      - name: Chart-testing lint (ct lint)
        run: |
          ct lint --config .github/ct.yaml --charts helm/secureflow

      - name: Helm unit tests (helm-unittest)
        run: |
          helm unittest helm/secureflow

      - name: Helm template contract verification
        run: |
          bash scripts/test-helm-chart.sh
