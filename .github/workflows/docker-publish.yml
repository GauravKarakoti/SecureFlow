name: Docker Build & Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build, Sign & Attest Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lowercase owner
        id: owner
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: echo "value=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Install Cosign for keyless image signing and attestation (Sigstore Fulcio/Rekor via GitHub OIDC)
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Exposes DOCKER_METADATA_OUTPUT_* env vars used by the build step.
      # Produces tags:
      #   ghcr.io/<owner>/secureflow:latest
      #   ghcr.io/<owner>/secureflow:<short-sha>  (e.g. abc1234)
      #   ghcr.io/<owner>/secureflow:1.2.3      (from the triggering v*.*.* tag)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/secureflow
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Authenticate to GitHub Container Registry using the auto-provisioned
      # GITHUB_TOKEN — no manual secret required.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Layer cache is stored in the registry itself (mode=max captures every
      # intermediate layer, not just the final stage), so cold builds on a
      # fresh runner still benefit from previously-cached layers.
      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.value }}/secureflow:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.value }}/secureflow:buildcache,mode=max

      # Keyless signing via GitHub OIDC. Signs the immutable image digest, NOT a mutable tag.
      - name: Sign container image with Cosign
        env:
          COSIGN_YES: "true"
          IMAGE_OWNER: ${{ steps.owner.outputs.value }}
          IMAGE_DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign sign --yes \
            "ghcr.io/$IMAGE_OWNER/secureflow@$IMAGE_DIGEST"

      # Generate CycloneDX Software Bill of Materials (SBOM) for the built image
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ghcr.io/${{ steps.owner.outputs.value }}/secureflow@${{ steps.build-and-push.outputs.digest }}
          format: cyclonedx-json
          output-file: secureflow-sbom.cyclonedx.json

      # Attach the CycloneDX SBOM as an in-toto attestation to the exact image digest
      - name: Attach CycloneDX SBOM attestation with Cosign
        env:
          COSIGN_YES: "true"
          IMAGE_OWNER: ${{ steps.owner.outputs.value }}
          IMAGE_DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign attest --yes \
            --type cyclonedx \
            --predicate secureflow-sbom.cyclonedx.json \
            "ghcr.io/$IMAGE_OWNER/secureflow@$IMAGE_DIGEST"

      # Generate and attach SLSA build provenance attestation to the exact image digest
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.value }}/secureflow
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true
