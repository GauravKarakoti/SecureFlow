name: Publish CLI to NPM

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
      - "cli-v[0-9]+.[0-9]+.[0-9]+"
      - "cli-v[0-9]+.[0-9]+.[0-9]+-*"
      - "cli-*[0-9]+.[0-9]+.[0-9]+"
      - "cli@[0-9]+.[0-9]+.[0-9]+"
      - "secureflow-cli@[0-9]+.[0-9]+.[0-9]+"
      - "secureflow-cli@[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "NPM distribution tag (e.g., latest, next, beta)"
        required: false
        default: "latest"
      dry_run:
        description: "Dry run (verify build & package without publishing)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-cli:
    name: Build, Test & Publish SecureFlow CLI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck CLI workspace
        run: npm run cli:typecheck

      - name: Run CLI unit tests
        run: npm run cli:test

      - name: Build CLI package
        run: npm run cli:build

      - name: Verify CLI binary executable & help output
        run: |
          test -f packages/cli/dist/index.js || { echo "❌ CLI build failed: packages/cli/dist/index.js not found"; exit 1; }
          node packages/cli/dist/index.js --help

      - name: Extract CLI version
        id: pkg
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 SecureFlow CLI version to publish: $VERSION"

      - name: Publish to NPM Registry (Dry Run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        working-directory: packages/cli
        env:
          DIST_TAG: ${{ github.event.inputs.dist_tag || 'latest' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_AUTH_TOKEN }}
        run: |
          echo "🔍 Running npm publish --dry-run..."
          npm publish --dry-run --access public --tag "$DIST_TAG"

      - name: Publish to NPM Registry
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: packages/cli
        env:
          DIST_TAG: ${{ github.event.inputs.dist_tag || 'latest' }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_AUTH_TOKEN }}
        run: |
          echo "🚀 Publishing secureflow-cli@$PKG_VERSION to NPM..."
          npm publish --access public --tag "$DIST_TAG" --provenance
