name: Nightly Prompt Injection Fuzzing

on:
  schedule:
    # Run every night at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  redteam-fuzzing:
    name: Red-Team Fuzzing Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run prompt injection fuzzing suite
        run: npx vitest run src/ai/flows/heist-prompt-guard.test.ts
        env:
          NODE_ENV: test
          GROQ_API_KEY: dummy-key-for-build
          VITEST: "true"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzzing-results
          path: test-results/
          retention-days: 7
