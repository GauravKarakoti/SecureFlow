name: Nightly Prompt Injection Fuzzing

on:
  schedule:
    # Run every night at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  redteam-fuzzing:
    name: Red-Team Fuzzing Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run prompt injection fuzzing suite
        run: npx vitest run src/ai/flows/heist-prompt-guard.test.ts
        env:
          NODE_ENV: test
          GROQ_API_KEY: dummy-key-for-build
          VITEST: "true"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzing-results
          path: test-results/
          retention-days: 7
