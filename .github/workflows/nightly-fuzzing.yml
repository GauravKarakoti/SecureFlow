name: Nightly AI Fuzzing & Red-Teaming

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  fuzzing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Red-Team Fuzzing Tests
        run: npx vitest run src/ai/flows/heist-prompt-guard.redteam.test.ts --run
