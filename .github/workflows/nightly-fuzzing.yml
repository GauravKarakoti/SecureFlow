name: Nightly Prompt Injection Fuzzing

on:
  schedule:
    # Run every night at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  redteam-fuzzing:
    name: Red-Team Fuzzing Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run prompt injection fuzzing suite
        run: npx vitest run src/ai/flows/heist-prompt-guard.test.ts
        env:
          NODE_ENV: test
          GROQ_API_KEY: dummy-key-for-build
          VITEST: "true"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzzing-results
          path: test-results/
          retention-days: 7
