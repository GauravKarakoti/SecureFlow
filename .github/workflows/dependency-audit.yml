name: Dependency Security Audit

on:
  schedule:
    # Runs weekly every Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch: # Allows running on demand from the Actions tab

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: NPM Audit (High & Critical)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Run npm audit on root project
        run: |
          echo "Running npm audit for root dependencies (fails on high or critical advisories)..."
          npm audit --audit-level=high

      - name: Run npm audit on CLI workspace
        if: always()
        run: |
          echo "Running npm audit for CLI workspace dependencies (fails on high or critical advisories)..."
          npm audit --audit-level=high --workspace=packages/cli
