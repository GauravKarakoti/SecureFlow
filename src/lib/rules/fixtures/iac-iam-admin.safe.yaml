AWSTemplateFormatVersion: '2010-09-09'
Description: Scoped least-privilege role template
Resources:
  ScopedWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ScopedWorkerRole
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SqsProcessing
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                Resource: !GetAtt MyQueue.Arn
