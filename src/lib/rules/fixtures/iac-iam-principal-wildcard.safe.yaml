AWSTemplateFormatVersion: '2010-09-09'
Description: Scoped principal policy with condition
Resources:
  RestrictedBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: my-secure-bucket
      PolicyDocument:
        Statement:
          - Sid: AllowOrgAccessWithCondition
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: arn:aws:s3:::my-secure-bucket/*
            Condition:
              StringEquals:
                aws:PrincipalOrgID: o-1234567890
          - Sid: AllowSpecificAccount
            Effect: Allow
            Principal:
              AWS: arn:aws:iam::123456789012:root
            Action: s3:PutObject
            Resource: arn:aws:s3:::my-secure-bucket/*
