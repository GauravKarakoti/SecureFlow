AWSTemplateFormatVersion: "2010-09-09"
Description: Over-permissive IAM role template
Resources:
  VulnerableAdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: OverpermissiveAdminRole
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RootAdmin
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: "*"
                Resource: "*"
